
services:
  db:
    image: postgres:latest
    container_name: ballrae-postgres
    restart: always
    env_file:
      - .env
    # 호스트 접속 불필요(내부는 db:5432). 호스트 포트 충돌 회피 위해 발행 제거.
    # 호스트에서 psql 필요하면 'docker compose exec db psql -U jihee -d ballrae' 사용.
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: ballrae-backend
    working_dir: /app
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      # 호스트 8000이 점유돼(잔여 docker-proxy) 8088로 발행. 컨테이너 내부는 8000 유지.
      # 내부 통신(pli-api -> ballrae-backend:8000)은 영향 없음. 호스트에서는 localhost:8088.
      - "8088:8000"
    depends_on:
      - db

  # celery:
  #   build: .
  #   container_name: ballrae-celery
  #   command: celery -A ballrae_backend worker --loglevel=info
  #   working_dir: /app
  #   volumes:
  #     - .:/app
  #   depends_on:
  #     - web
  #     - redis
  #   env_file:
  #     - .env
  #   restart: always

  redis:
    image: redis:7
    container_name: ballrae-redis
    ports:
      # 호스트 6379가 이미 점유된 환경 대비: 호스트는 6380으로 발행.
      # 컨테이너 간 통신은 내부 네트워크 ballrae-redis:6379 그대로라 영향 없음.
      - "6380:6379"
    restart: no


  hate-filter-api:
    build:
      context: ./hate-filter-api
      dockerfile: Dockerfile  # 명시해주는 것이 명확함
    container_name: hate-filter-api
    ports:
      - "8001:8001"
    restart: always
    volumes:
      - ./hate-filter-api/app:/app  

  pli-api:
    build:
      context: ./pli-api
      dockerfile: Dockerfile
    container_name: pli-api
    ports:
      - "8002:8002"
    restart: no
    environment:
      - REDIS_HOST=ballrae-redis
      - REDIS_PORT=6379
    volumes:
      - ./data:/app/data
      - ./pli-api/app:/app
    depends_on:
      - redis

  # PLI 비동기 작업(RQ job) 처리 워커.
  # /calculate_pli_raw 로 enqueue 된 job 을 실제로 실행한다.
  # 이 워커가 없으면 job 이 큐에 쌓이기만 하고 처리되지 않아 PLI 가 영원히 반환되지 않음.
  pli-worker:
    build:
      context: ./pli-api
      dockerfile: Dockerfile
    container_name: pli-worker
    working_dir: /app
    command: rq worker --url redis://ballrae-redis:6379/0
    environment:
      - REDIS_HOST=ballrae-redis
      - REDIS_PORT=6379
      - PYTHONPATH=/app
    restart: no
    volumes:
      - ./data:/app/data
      - ./pli-api/app:/app
    depends_on:
      - redis
      - pli-api

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: ballrae-zookeeper
    # 호스트에서 접속할 일이 없어 포트 발행 제거 (컨테이너 간 ballrae-zookeeper:2181 내부 통신)
    restart: no
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: ballrae-kafka
    user: "root"
    # 호스트 접속 불필요(advertised listener가 kafka:9092라 호스트 발행은 무의미) → 포트 제거
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: ballrae-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIR: /var/lib/kafka/data
    restart: no
    depends_on:
      - zookeeper
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-consumer:
    container_name: ballrae-kafka-consumer
    build: .
    command: python -u ballrae_backend/streaming/consumer.py
    depends_on:
      - db
      - kafka
    env_file:
      - .env
    volumes:
      - .:/app
    # # kafka가 실행안되면 broker unavailable뜨니까~
    restart: no
    working_dir: /app
  
  kafka-producer:
    container_name: ballrae-kafka-producer
    build: .
    command: python -u ballrae_backend/streaming/producer.py
    depends_on:
      - db
      - kafka
    env_file:
      - .env
    volumes:
      - .:/app
    restart: no
    working_dir: /app
  
